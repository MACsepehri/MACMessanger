{% extends "inc/indexPage.html" %}

{% block head %}
    <link rel="stylesheet" href="/static/css/index/index.css">
{% endblock %}

{% block sidebar %}
    <div class="right">
        <br>
        <div class="right-content">
            <button onclick="javascript:addContact();">
                اضافه کردن مخاطب
            </button>
            {% for data in audience %}
                <button id="contact" onclick="javascript:openUserContactBox('{{ session.profile.username }}', '{{ data.capitalize()[:50] }}');">
                    {{ data.capitalize()[:50] }}
                </button>
            {% endfor %}
        </div>
    </div>
    <div class="left">
        <div class="left-content">
            
        </div>
    </div>
{% endblock %}

{% block script %}
    <script src="/static/script/index.js"></script>
{% endblock %}
