<div class="contact-box">
    <div class="add-contact">
        <div class="title">
            <h2>Add new contact</h2>
        </div>
        <div class="add-contact-form">
            <form action="/add-contact" method="post" id="add-contact-form">
                <input type="number" placeholder="Public ID" name="publicID" id="publicID"><br>
            </form>
            <div class="add-contact-button-box">
                <button onclick="javascript:AddContact();">Add</button>
            </div>
        </div>
    </div>
    <div class="chat-room">
        <div class="chatroom-title">
            From <u id="from-user">{{ user.name }}</u> To <u id="to-user"></u>
        </div>
        <div style="padding: 20px;"></div>
        <div class="messages"></div>
        <div class="chatbox">
            <textarea type="text" placeholder="Message ..." id="message-area"></textarea>
            <button onclick="javascript:send_message('{{ user.name }}');">↑</button>
        </div>
    </div>
</div>
